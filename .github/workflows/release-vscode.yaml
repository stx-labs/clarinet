# The vscode extension is built with vsce and published to both
# the VSCode Marketplace and Open VSX when a release is created.

name: Publish VSCode Extension
on:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

concurrency:
  group: "${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}"
  cancel-in-progress: false

defaults:
  run:
    working-directory: ./components/clarity-vscode

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'

      - name: Setup Rust
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
          cargo install wasm-pack

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build vsix
        run: pnpm exec vsce package --out clarity.vsix

      - name: Upload vsix artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: clarity-vsix
          path: ./components/clarity-vscode/clarity.vsix
          if-no-files-found: error
          retention-days: 7

  publish-vscode-marketplace:
    name: Publish to VSCode Marketplace
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'release'
    environment: release-vscode-extension

    permissions:
      contents: read
      id-token: write
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'

      - name: Download vsix artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: clarity-vsix
          path: ./components/clarity-vscode

      - name: Azure login
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Publish to VSCode Marketplace
        run: npx -y @vscode/vsce@4.0.0 publish --packagePath clarity.vsix --azure-credential

  publish-open-vsx:
    name: Publish to Open VSX
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'release'
    environment: release-vscode-extension

    permissions:
      contents: read
      id-token: write
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'

      - name: Download vsix artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: clarity-vsix
          path: ./components/clarity-vscode

      - name: Publish to Open VSX
        run: npx -y ovsx@1.3.0 publish --packagePath clarity.vsix --trusted-publishing
