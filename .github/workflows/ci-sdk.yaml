name: CI - Clarinet SDK
on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**/CHANGELOG.md"
  push:
    branches:
      - main
    paths-ignore:
      - "**/CHANGELOG.md"

# Cancel previous runs for the same workflow
permissions: {}

concurrency:
  group: "${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}"
  cancel-in-progress: true

jobs:
  build_wasm:
    name: Build and test Wasm packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RUSTFLAGS: "-Dwarnings"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown

      - name: Setup cache keys
        id: rust-version
        run: |
          RUST_VERSION=$(rustc -vV | shasum -a 256 | cut -d ' ' -f1)
          echo "hash=$RUST_VERSION" >> $GITHUB_OUTPUT

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.x"

      - name: Cache cargo
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-${{ github.job }}-${{ steps.rust-version.outputs.hash }}-${{ hashFiles('./Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ github.job }}-${{ steps.rust-version.outputs.hash }}-
            ${{ runner.os }}-${{ github.job }}-

      - name: Run clippy
        run: cargo clippy --package clarinet-sdk-wasm --target wasm32-unknown-unknown

      # Clippy runs on every workspace crate in the graph, so `-p clarinet-sdk-wasm`
      # covers clarity-repl, clarinet-files and clarinet-deployments too.
      - name: Check for stdout macros in Wasm code
        env:
          CLIPPY_CONF_DIR: ${{ github.workspace }}/lints/wasm
        run: >
          cargo clippy --no-default-features --lib --target wasm32-unknown-unknown
          -p clarinet-sdk-wasm -- -A clippy::all -D clippy::disallowed_macros

      - name: Install wasm-pack if not available
        run: |
          if ! command -v wasm-pack &> /dev/null; then
            cargo install wasm-pack
          fi

      - name: Install dependencies (skip prepare scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build Wasm packages
        run: pnpm run build:sdk-wasm

      - name: Run wasm-bindgen-test
        run: wasm-pack test --node components/clarinet-sdk-wasm

      - name: Upload Wasm artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wasm-artifacts
          path: components/clarinet-sdk-wasm/pkg-*

  test:
    name: Run clarinet-sdk tests
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [22.x, 24.x]
    needs: build_wasm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Download Wasm artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wasm-artifacts
          path: components/clarinet-sdk-wasm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        env:
          HIRO_API_KEY: ${{ secrets.HIRO_API_KEY }}
        run: pnpm run test
