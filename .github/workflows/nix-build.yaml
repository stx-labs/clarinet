name: Nix build
on:
  # Uncached builds take ~6 min on Linux and ~15 min on macOS, so PRs only build when the flake changes
  pull_request:
    branches:
      - main
    paths:
      - flake.nix
      - flake.lock
      - .github/workflows/nix-build.yaml
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

concurrency:
  group: "${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  nix-build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04-arm
          - macos-26
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@16f94ba7aae399b9f9077c254b6719ec6de7e3e3 # v3.24.2

      - run: nix build -L
