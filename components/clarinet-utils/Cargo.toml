[package]
name = "clarinet-utils"
version = "1.0.0"
description = "Clarinet helpers"
license = "MIT"
edition = "2021"

[dependencies]
aes-gcm = { workspace = true, features = ["aes", "alloc"] }
argon2 = { workspace = true, features = ["alloc"] }
bip32 = { workspace = true, features = ["alloc"] }
bip39.workspace = true
bs58.workspace = true
rand.workspace = true
strum = { workspace = true, features = ["derive"] }

[dev-dependencies]
divan = { workspace = true }

[[bench]]
name = "bip32"
harness = false

[lints]
workspace = true
