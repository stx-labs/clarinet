[package]
name = "clarinet-utils"
version = "1.0.0"
description = "Clarinet helpers"
license = "MIT"
edition = "2021"

[dependencies]
aes-gcm.workspace = true
argon2.workspace = true
bip39 = "3.0.0"
bip32 = { version = "0.6.0", features = ["alloc"] }
bs58.workspace = true
libsecp256k1.workspace = true
rand.workspace = true

[lib]
name = "clarinet_utils"
path = "src/lib.rs"

[dev-dependencies]
divan = { workspace = true }

[[bench]]
name = "bip32"
harness = false

[lints]
workspace = true
